name: Trend-Radar aktualisieren

# Ziel: Dashboard jeden Morgen gegen 7:00 Uhr Wiener Zeit aktuell.
# GitHub-Cron läuft nur in UTC und kennt keine Sommerzeit. Darum zwei Termine:
#   30 4 * * *  -> 05:30 MESZ (Sommer)  -> wird nur im Sommer ausgeführt
#   30 5 * * *  -> 06:30 MEZ  (Winter)  -> wird nur im Winter ausgeführt
# Der Start 30 Minuten vor 7 fängt die üblichen Verspätungen geplanter GitHub-Läufe ab,
# sodass die Daten um 7 Uhr bereitstehen. Der jeweils "falsche" Termin bricht sofort ab.
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trend-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Sommer-/Winterzeit prüfen
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Vienna date +%z)   # +0200 im Sommer, +0100 im Winter
          run=true
          if [ "$SCHEDULE" = "30 4 * * *" ] && [ "$offset" != "+0200" ]; then run=false; fi
          if [ "$SCHEDULE" = "30 5 * * *" ] && [ "$offset" != "+0100" ]; then run=false; fi
          echo "Wien: $(TZ=Europe/Vienna date '+%F %T %Z'), Trigger: ${{ github.event_name }} '$SCHEDULE' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Jedes Skript darf einzeln scheitern; dann bleibt die Datei vom Vortag stehen
      # und das Dashboard zeigt einen Hinweis auf veraltete Daten.
      - name: News holen (Hacker News, Reddit)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        run: if [ -f scripts/news.py ]; then python scripts/news.py; else echo "scripts/news.py fehlt noch, übersprungen"; fi

      - name: GitHub-Trends holen
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        run: if [ -f scripts/github_trends.py ]; then python scripts/github_trends.py; else echo "scripts/github_trends.py fehlt noch, übersprungen"; fi

      - name: Content-Ideen erzeugen
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        run: if [ -f scripts/ideas.py ]; then python scripts/ideas.py; else echo "scripts/ideas.py fehlt noch, übersprungen"; fi

      - name: Daten committen
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Daten aktualisiert: $(TZ=Europe/Vienna date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Seite zusammenstellen
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/*.json _site/data/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: _site

  deploy:
    needs: update
    if: needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
